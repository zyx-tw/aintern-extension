<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>AIntern 設定</title><link rel="stylesheet" href="panel.css">
<style>body { align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; } #form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; } input { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; } button { border: 0; border-radius: 8px; padding: 6px 14px; background: var(--fg); color: var(--bg); font: inherit; cursor: pointer; } #status { color: var(--muted); }</style>
</head>
<body>
  <div id="form">
    <label for="instance">AIntern 網址</label>
    <input id="instance" type="url" placeholder="https://aintern.example.edu">
    <button id="save" type="button">儲存</button>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
